[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "p2p-qa"
version = "0.1.0"
description = "Autonomous, evidence-driven QA agent for Purchase-to-Pay APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "pytest-cov>=5,<8"]

[project.scripts]
p2p-qa = "p2p_qa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

